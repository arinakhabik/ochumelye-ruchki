name: Laravel CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - uat
      - main
      - master

permissions:
  contents: write

jobs:
  pint-auto-fix:
    name: Pint auto-fix for short-lived branches
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      github.ref != 'refs/heads/develop' &&
      github.ref != 'refs/heads/uat' &&
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, json, libxml, mbstring, pdo_sqlite, sqlite3, tokenizer, xml, xmlwriter
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Laravel Pint auto-fix
        run: vendor/bin/pint

      - name: Commit style fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Apply Laravel Pint formatting"
            git push
          else
            echo "No formatting changes."
          fi

  quality:
    name: Tests, static analysis and linting
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/uat' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      github.base_ref == 'develop' ||
      github.base_ref == 'uat' ||
      github.base_ref == 'main' ||
      github.base_ref == 'master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, json, libxml, mbstring, pdo_sqlite, sqlite3, tokenizer, xml, xmlwriter
          coverage: xdebug

      - name: Prepare CI environment
        run: |
          cp .env.ci .env
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Clear config cache
        run: php artisan config:clear

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Laravel tests with coverage gate
        env:
          XDEBUG_MODE: coverage
        run: php artisan test --coverage --min=50

      - name: Run PHPStan / Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run Laravel Pint in test mode
        run: vendor/bin/pint --test

  deploy-dev:
    name: Simulate deploy to DEV
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use DEV env file
        run: |
          cp .env.dev .env
          echo "Deploying to DEV with .env.dev"

  deploy-uat:
    name: Simulate deploy to UAT
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    environment: uat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use UAT env file
        run: |
          cp .env.uat .env
          echo "Deploying to UAT with .env.uat"

  deploy-prod:
    name: Simulate deploy to PROD
    runs-on: ubuntu-latest
    needs: quality
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use PROD env file
        run: |
          cp .env.prod .env
          echo "Deploying to PROD with .env.prod"

  notify:
    name: Notify maintainers
    runs-on: ubuntu-latest
    needs:
      - quality
      - deploy-dev
      - deploy-uat
      - deploy-prod
    if: always()

    steps:
      - name: Send Telegram notification if secrets are configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEV_RESULT: ${{ needs.deploy-dev.result }}
          UAT_RESULT: ${{ needs.deploy-uat.result }}
          PROD_RESULT: ${{ needs.deploy-prod.result }}
        run: |
          MESSAGE="Laravel pipeline result for $GITHUB_REPOSITORY on $GITHUB_REF_NAME: quality=$QUALITY_RESULT, dev=$DEV_RESULT, uat=$UAT_RESULT, prod=$PROD_RESULT"

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="$MESSAGE"
          else
            echo "$MESSAGE"
            echo "Telegram secrets are not configured, notification is skipped."
          fi
